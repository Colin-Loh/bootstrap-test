---
- name: Check if VM is Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
    fail_msg: "This role currently supports Ubuntu only."

- name: Install perlbrew
  ansible.builtin.apt:
    update_cache: true
    name: perlbrew
    state: present
  become: true

## Installing old Perl version via perlbrew

## Prerequisites:
- name: Install bzip2
  ansible.builtin.apt:
    update_cache: true
    name: bzip2
    state: present
  become: true

- name: Initialize perlbrew for {{ perlbrew_user }}
  become: true
  become_user: "{{ perlbrew_user }}"
  ansible.builtin.shell: |
    perlbrew init
  args:
    executable: /bin/bash

- name: Source perlbrew in {{ perlbrew_user }} .bashrc
  become: true
  become_user: "{{ perlbrew_user }}"
  ansible.builtin.lineinfile:
    path: "/home/{{ perlbrew_user }}/.bashrc"
    line: "source ~/perl5/perlbrew/etc/bashrc"
    insertafter: EOF
    state: present
    create: yes
    mode: "0644"

- name: Install patchperl for {{ perlbrew_user }}
  become: true
  become_user: "{{ perlbrew_user }}"
  ansible.builtin.shell: |
    source ~/perl5/perlbrew/etc/bashrc
    perlbrew install-patchperl
  args:
    executable: /bin/bash

- name: Install Perl {{ perl_version }} via perlbrew (idempotent)
  become: true
  become_user: "{{ perlbrew_user }}"
  ansible.builtin.shell: |
    source ~/perl5/perlbrew/etc/bashrc
    perlbrew list | grep -q '^perl-{{ perl_version }}$' || perlbrew install --notest perl-{{ perl_version }}
  args:
    executable: /bin/bash

- name: Switch default Perl to {{ perl_version }}
  become: true
  become_user: "{{ perlbrew_user }}"
  ansible.builtin.shell: |
    source ~/perl5/perlbrew/etc/bashrc
    perlbrew switch perl-{{ perl_version }}
  args:
    executable: /bin/bash
